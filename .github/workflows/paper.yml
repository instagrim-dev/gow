name: Paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile manuscript (tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('paper/geometry-of-work.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-

      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/

      - name: Compile
        working-directory: paper
        run: tectonic geometry-of-work.tex

      - name: Duplicate-label guard
        run: |
          dups="$(grep -o '\\label{[^}]*}' paper/geometry-of-work.tex | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "duplicate labels:" >&2
            echo "$dups" >&2
            exit 1
          fi

      - name: Draft-annotation lint
        run: |
          # Suppressing draft-macro output is not a completion check, so we lint
          # the source. Strip TeX comments first, then forbid (a) any invocation
          # of the draft macros in the body and (b) literal placeholder markers.
          # The preamble opt-in block (\newif/\newcommand/\ifgowdraft) is allowed.
          stripped="$(sed 's/\([^\\]\)%.*/\1/; s/^%.*//' paper/geometry-of-work.tex)"
          invocations="$(printf '%s\n' "$stripped" \
            | grep -nE '\\(todo|claimnote|evidence)\{' \
            | grep -vE '\\newcommand\{\\(todo|claimnote|evidence)\}' || true)"
          if [ -n "$invocations" ]; then
            echo "unresolved draft annotations (\\todo/\\claimnote/\\evidence) invoked in body:" >&2
            echo "$invocations" >&2
            exit 1
          fi
          placeholders="$(printf '%s\n' "$stripped" \
            | grep -nE '\[TODO:|\[CLAIM:|\[EVIDENCE:|\bTKTK\b|\bFIXME\b' \
            | grep -vE '\\newcommand\{\\(todo|claimnote|evidence)\}' || true)"
          if [ -n "$placeholders" ]; then
            echo "placeholder markers found in source:" >&2
            echo "$placeholders" >&2
            exit 1
          fi

      - name: Unresolved-reference guard
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          # xelatex prints "??" for broken \ref/\cite in the PDF; fail if present.
          if pdftotext -layout paper/geometry-of-work.pdf - 2>/dev/null | grep -n '??'; then
            echo "unresolved cross-references (??) rendered in PDF" >&2
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry-of-work-pdf
          path: paper/geometry-of-work.pdf
          retention-days: 30
